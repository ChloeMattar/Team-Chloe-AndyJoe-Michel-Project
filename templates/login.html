{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<form method="post" action="{{ url_for('login') }}" novalidate class="auth">
  <h1>Log in</h1>

  <label>Username <input type="username" name="username" value="{{ data.get('username','') }}"></label>
  {% if errors.get('username') %}<span class="error">{{ errors['username'] }}</span>{% endif %}
  
  <label>Password <input type="password" name="password"></label>
  {% if errors.get('password') %}<span class="error">{{ errors['password'] }}</span>{% endif %}
  
  <button type="submit">Log in</button>
  
  <p>No account? <a href="{{ url_for('signup') }}">Sign up</a>.</p>
</form>

{% endblock %}
